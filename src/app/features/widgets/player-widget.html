<h2>
  <span class="title">
    @if (playing(); as c) {
      {{ c.name }}
    } @else {
      Live TV
    }
  </span>
  <span class="meta pstat" [class]="status().state">{{ text() }}</span>
  @if (playing(); as c) {
    <button
      type="button"
      class="meta icon"
      [title]="muted() ? 'Unmute' : 'Mute'"
      [attr.aria-label]="muted() ? 'Unmute' : 'Mute'"
      (click)="muted.set(!muted())"
    >
      {{ muted() ? '🔇' : '🔊' }}
    </button>
    <a
      class="meta icon"
      queryParamsHandling="preserve"
      title="Open Watch page"
      aria-label="Open Watch page"
      [routerLink]="['/watch', c.key]"
      >↗</a
    >
    @if (!pinned()) {
      <a
        class="meta icon"
        queryParamsHandling="merge"
        title="Stop"
        aria-label="Stop"
        [routerLink]="[]"
        [queryParams]="{ ch: null }"
        >■</a
      >
    }
  }
  <sw-card-buttons [card]="card" />
</h2>
<div class="screen">
  @if (playing(); as c) {
    <sw-player [url]="c.url" [muted]="muted()" (status)="status.set($event)" />
  } @else if (lineup.channels().length) {
    <p class="muted">Pick a channel to watch here.</p>
  } @else {
    <p class="muted">
      <a routerLink="/setup" fragment="iptv">Add an IPTV source</a> to watch live TV.
    </p>
  }
</div>
