version: 2

# One weekly pull request for everything (npm, GitHub Actions, Docker base images), plus one per
# ecosystem for security fixes. Version updates wait out a 7-day cooldown, so a compromised release
# is usually caught before it reaches a PR (security updates are not delayed).
# Major versions are left out so that PR stays green: they usually need code changes or are blocked by
# Angular's supported ranges (e.g. Angular 22 requires TypeScript 6.0.x), and odd Node.js majors never
# become LTS. Do major upgrades by hand (`ng update` for Angular; a new @devenvy/code-guidelines major
# is a deliberate baseline change).
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    # conventional titles for release-please: dependency updates ship as a patch release
    # (with multi-ecosystem groups, commit-message is only allowed on the group)
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
      exclude: ['@devenvy/*'] # our own baseline updates arrive without delay
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Angular 22's compiler supports TypeScript 6.0.x only
      - dependency-name: typescript
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
