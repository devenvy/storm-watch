name: Docker

# Runs on every pull request. Pushes to main and release tags run it through pages.yml / release.yml,
# which only publish when it passes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when run from pages.yml / release.yml, so their gates never
  # collide with (or get cancelled by) scheduled or manual runs.
  group: docker-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: stormwatch:ci
      - name: Smoke test
        run: |
          docker run -d --name sw --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 stormwatch:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          curl -fsS http://127.0.0.1:8080/ | grep -q '<sw-root>'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'http-equiv="Content-Security-Policy"'
      - name: Container logs
        if: failure()
        run: docker logs sw
