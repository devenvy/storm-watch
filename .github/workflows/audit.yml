name: Audit

# Runs on every pull request. Pushes to main and release tags run it through pages.yml / release.yml,
# which only publish when it passes.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Runtime dependencies only; dev tooling never ships to the browser.
      - run: npm audit --omit=dev --audit-level=high
