# Included in every location: nginx drops inherited add_header directives as soon as a
# location declares its own, so headers live here instead of at server level.
#
# The app is fully client-side: it calls public weather APIs and the viewer's own IPTV
# server directly from the browser, so connect/media/img must allow any host. Scripts are
# restricted to this origin; Angular component styles are injected inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; connect-src *; worker-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), fullscreen=(self), autoplay=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# When served behind TLS, also enable:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
