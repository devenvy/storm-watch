# Static file server for the Storm Watch build (runs as non-root on :8080).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed bundles never change: cache for a year.
    location ~* "-[0-9A-Z]{8}\.(js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Routing uses #/ URLs, so only real files exist; anything else is a 404.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
